#fx{position:fixed;inset:0;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
.hud{position:fixed;pointer-events:none;text-shadow:0 0 12px #0008}
.title{left:max(18px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 14px);padding:8px 16px;background:var(--glass);border:1px solid #19e6f580;border-radius:12px;backdrop-filter:blur(6px)}
.title b{font-weight:800;letter-spacing:.3em;font-size:clamp(14px,2.2vw,24px);color:var(--c)}
.title small{display:block;font-size:10px;letter-spacing:.2em;opacity:.8}
.clock{right:18px;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:right;padding:8px 16px;background:var(--glass);border:1px solid #19e6f580;border-radius:12px;backdrop-filter:blur(6px)}
.clock div{font-size:clamp(16px,2.6vw,28px);font-weight:800;color:var(--c)}
.clock small{font-size:10px;letter-spacing:.12em;text-transform:capitalize}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(760px,94vw);display:flex;flex-direction:column;gap:8px}
#log{max-height:26vh;overflow-y:auto;padding:10px 14px;background:var(--glass);border:1px solid #19e6f566;border-radius:14px;backdrop-filter:blur(8px);font-family:"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
#log p{margin:4px 0}#log .u{color:#bff7ff;text-align:right}#log .d{color:#fff}
#log a{color:var(--c)}
#st{text-align:center;font-size:11px;letter-spacing:.25em;color:#063a48;font-weight:800;text-shadow:0 0 8px #fff}
#row{display:flex;gap:8px}
#in{flex:1;min-width:0;padding:10px 14px;border-radius:12px;border:1px solid #19e6f5aa;background:var(--glass);color:var(--ink);font:14px "Segoe UI",system-ui,sans-serif;outline:none;backdrop-filter:blur(8px)}
#in::placeholder{color:#9fe6ee}

<body>
<div id="bg"></div>
<video id="cam" playsinline muted></video>
<canvas id="fx"></canvas>
<div id="world"></div><canvas id="as"></canvas><canvas id="a3"></canvas><canvas id="hc"></canvas>
<div class="hud title"><b>DRACO 2.0</b><small>ASISTENTE VIRTUAL AVANZADO</small></div>
<div class="hud clock"><div id="ck">--:--</div><small id="dt"></small></div>
<div id="tm"></div>
<div id="dock">
  <div id="st">TOCA LA ESFERA PARA HABLAR</div>
  <div id="log"></div>
  <div id="row"><input id="in" placeholder="O escríbele a Draco aquí…" autocomplete="off"><button id="go">ENVIAR</button><button id="bw" title="Abrir ventana">VENTANA</button><button id="bm" title="Cargar canciones">MÚSICA</button><button id="bar" title="Realidad aumentada">AR</button><button id="bhd" title="Manipulación con manos">MANOS</button><button id="bvr" title="Gafas VR Box / Cardboard">VR</button><button id="clr" title="Borrar memoria">OLVIDAR</button></div>
</div>
<button id="mt">⚙ OPCIONES</button>
<button id="vx">SALIR VR</button>
<div id="mp"><span id="mpt"></span><button id="mpb">⏮</button><button id="mpp">▶</button><button id="mpn">⏭</button><button id="mps">🔀</button></div>
<div id="lc"></div>
<input id="mus" type="file" accept="audio/*,.mp3" multiple hidden>
<script>
(()=>{
const $=id=>document.getElementById(id);
const store={load(){try{return JSON.parse(localStorage.getItem('draco2')||'{}')}catch(e){return{}}},save(){try{localStorage.setItem('draco2',JSON.stringify(M))}catch(e){}}};
let M=Object.assign({name:'',hist:[],rem:[]},store.load());
const log=$('log'),st=$('st');
let state='idle',sample=null,timerEnd=0,timerInt=null;

/* ---------- Orbe ---------- */
const cv=$('fx'),g=cv.getContext('2d');let W,H,cx,cy,R,dpr=1;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);cx=W*.5;cy=H*.385;R=Math.min(W*.2,H*.27)*(typeof orbS==='number'?orbS:1)}
addEventListener('resize',size);size();
const N=3200,P=[];
for(let i=0;i<N;i++){const u=Math.random()*2-1,a=Math.random()*6.283,s=Math.sqrt(1-u*u),r=Math.pow(Math.random(),.35);P.push({x:s*Math.cos(a)*r,y:u*r,z:s*Math.sin(a)*r,p:Math.random()*9,w:.5+Math.random()*2,z0:Math.random()})}
let sparks=[],rings=[],lvl=.4,t=0,rot=0,pulse=0;
function burst(){const a=Math.random()*6.283,b=Math.random()*3.14-1.57,n=14+Math.random()*18|0;
 const ox=Math.cos(a)*Math.cos(b),oy=Math.sin(b),sp=2+Math.random()*3;
 for(let i=0;i<n;i++){const d=Math.random()*6.283,v=sp*(.3+Math.random());sparks.push({x:cx+ox*R,y:cy+oy*R,vx:ox*v*1.5+Math.cos(d)*v,vy:oy*v*1.5+Math.sin(d)*v,l:1,k:Math.random()<.4?1:0})}
 rings.push({x:cx+ox*R,y:cy+oy*R,r:2,l:1})}
function frame(){
 t+=.016;const tgt={idle:.45,listening:.8,thinking:1,speaking:.7}[state];
 lvl+=(tgt-lvl)*.05;if(state==='speaking')pulse=.5+.5*Math.sin(t*14)*Math.random();else pulse*=.9;
 rot+=.006+(state==='thinking'?.04:state==='listening'?.015:0);
 const r=R*(1+.04*Math.sin(t*2)+pulse*.1+(state==='listening'?.05*Math.sin(t*9):0));
 g.clearRect(0,0,W,H);g.globalCompositeOperation='lighter';
 /* halo */
 let h=g.createRadialGradient(cx,cy,r*.2,cx,cy,r*2.6);
 h.addColorStop(0,'rgba(255,255,255,'+(.2*lvl)+')');h.addColorStop(.25,'rgba(25,230,245,'+(.16*lvl)+')');h.addColorStop(1,'rgba(25,230,245,0)');
 g.fillStyle=h;g.fillRect(0,0,W,H);
 /* llamas */
 for(let k=0;k<3;k++){g.beginPath();for(let i=0;i<=90;i++){const a=i/90*6.283,w=Math.sin(a*5+t*(2+k)+k)*.07+Math.sin(a*9-t*3.3)*.05+Math.sin(a*3+t*1.7)*.06,rr=r*(1.03+w*(1+lvl)+k*.07);
  const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?g.lineTo(x,y):g.moveTo(x,y)}
  g.closePath();g.fillStyle='rgba(20,220,245,'+(.04+.03*lvl)+')';g.fill();g.strokeStyle='rgba(180,255,255,'+(.25-k*.06)+')';g.lineWidth=2;g.stroke()}
 /* núcleo */
 let c=g.createRadialGradient(cx,cy,0,cx,cy,r);
 c.addColorStop(0,'rgba(255,255,255,.22)');c.addColorStop(.35,'rgba(170,255,255,.12)');c.addColorStop(.75,'rgba(25,230,245,.08)');c.addColorStop(1,'rgba(0,150,200,.03)');
 g.fillStyle=c;g.beginPath();g.arc(cx,cy,r,0,6.283);g.fill();g.strokeStyle='rgba(190,255,255,.3)';g.lineWidth=1.5;g.beginPath();g.arc(cx,cy,r,0,6.283);g.stroke();
 /* partículas */
 const cs=Math.cos(rot),sn=Math.sin(rot);
 for(let i=0;i<N;i++){const p=P[i],x=p.x*cs-p.z*sn,z=p.x*sn+p.z*cs,y=p.y,
  tw=.5+.5*Math.sin(t*p.w*3+p.p),sc=1+z*.15,px=cx+x*r*1.12*sc,py=cy+y*r*1.12*sc;
  if(Math.random()<.002){p.p=Math.random()*9}
  const a=(.25+.75*tw)*(z>0?1:.55);
  g.fillStyle=(i&3)?'rgba(120,250,255,'+a+')':'rgba(255,255,255,'+a+')';
  const s=(i%17===0?2.2:1.1)*sc;g.fillRect(px,py,s,s)}
 /* chispas y explosiones */
 if(Math.random()<.05+lvl*.12)burst();
 if(Math.random()<.5){const a=Math.random()*6.283,v=1+Math.random()*2;sparks.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.2,l:1,k:Math.random()<.5?1:0})}
 for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vx*=.985;s.vy*=.985;s.l-=.018;
  if(s.l<=0){sparks.splice(i,1);continue}
  g.fillStyle=(s.k?'rgba(255,255,255,':'rgba(25,240,255,')+s.l+')';g.fillRect(s.x,s.y,2,2)}
 if(sparks.length>1800)sparks.splice(0,300);
 for(let i=rings.length-1;i>=0;i--){const q=rings[i];q.r+=3;q.l-=.06;if(q.l<=0){rings.splice(i,1);continue}
  g.strokeStyle='rgba(200,255,255,'+q.l+')';g.lineWidth=2;g.beginPath();g.arc(q.x,q.y,q.r,0,6.283);g.stroke()}
 g.globalCompositeOperation='source-over';requestAnimationFrame(frame)}
frame();

/* ---------- Reloj ---------- */
function tick(){const d=new Date();$('ck').textContent=d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 $('dt').textContent=d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const now=Date.now();M.rem.filter(r=>r.t&&r.t<=now&&!r.done).forEach(r=>{r.done=1;store.save();say('¡Ey! Te acuerdo: '+r.txt)})}
setInterval(tick,1000);tick();

/* ---------- Voz ---------- */
const syn=window.speechSynthesis;let voice=null;
function pickVoice(){const v=syn?syn.getVoices():[];voice=v.find(x=>/es[-_]CO/i.test(x.lang))||v.find(x=>/es[-_](MX|US|419)/i.test(x.lang))||v.find(x=>/^es/i.test(x.lang))||null}
if(syn){pickVoice();syn.onvoiceschanged=pickVoice}
function setState(s,txt){state=s;try{duck()}catch(e){}st.textContent=txt||({idle:'TOCA LA ESFERA PARA HABLAR',listening:'ESCUCHANDO…',thinking:'PROCESANDO…',speaking:'HABLANDO…'})[s]}
function add(cls,html){const p=document.createElement('p');p.className=cls;p.innerHTML=html;log.appendChild(p);if(cls==='d')st.textContent=p.textContent.slice(0,90);log.scrollTop=log.scrollHeight;return p}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
function say(txt,html){lastSay=txt;add('d','<b style="color:#19e6f5">Draco:</b> '+(html||esc(txt)));
 if(!syn){setState('idle');return}
 syn.cancel();const clean=txt.replace(/[*_#`]/g,'');
 const u=new SpeechSynthesisUtterance(clean);u.lang='es-CO';if(voice)u.voice=voice;u.rate=1.04;u.pitch=.95;
 u.onstart=()=>setState('speaking');u.onend=u.onerror=()=>setState('idle');syn.speak(u)}
function remember(role,content){M.hist.push({role,content});M.hist=M.hist.slice(-24);store.save()}

/* ---------- Reconocimiento ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function listen(){
 if(!SR){add('d','Tu navegador no soporta micrófono aquí. Escríbeme abajo, parce, o abre la página en Chrome.');return}
 if(syn)syn.cancel();
 rec=new SR();rec.lang='es-CO';rec.interimResults=false;rec.maxAlternatives=1;
 rec.onstart=()=>setState('listening');
 rec.onresult=e=>{const q=e.results[0][0].transcript;handle(q)};
 rec.onerror=e=>{setState('idle');if(e.error==='not-allowed'||e.error==='service-not-allowed')add('d','No tengo permiso para el micrófono. Revisa los permisos del navegador, o escríbeme abajo.')};
 rec.onend=()=>{if(state==='listening')setState('idle')};
 try{rec.start()}catch(e){}}
$('fx').addEventListener('click',()=>{if(state==='listening'){try{rec.stop()}catch(e){}setState('idle')}else if(state==='speaking'){syn.cancel();setState('idle')}else listen()});
function send(){const v=$('in').value.trim();if(v){$('in').value='';handle(v)}}
$('go').onclick=send;$('in').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
$('clr').onclick=()=>{M={name:'',hist:[],rem:[]};store.save();log.innerHTML='';say('Listo, borré mi memoria. Como si nos acabáramos de conocer.')};

/* ---------- Cerebro local ---------- */
const jokes=['¿Por qué los programadores confunden Halloween con Navidad? Porque OCT 31 es igual a DEC 25.','Mi plata y yo somos como el wifi del vecino: nos conectamos poquito y se nos va rapidito.','¿Qué le dice un bus a otro bus? Nada, en Bogotá los dos van en el mismo trancón.','Le pregunté a mi nevera si tenía algo rico y me respondió con una luz y un silencio incómodo.','¿Sabes cuál es el colmo de un electricista? Que su esposa le diga: ¡Ya no hay química entre nosotros!','Dicen que el dinero no compra la felicidad, pero uno llora más cómodo en un carro bueno.','Yo no estoy gordo, es que mi ropa encogió en solidaridad con la quincena.'];
const sites={youtube:'https://www.youtube.com',google:'https://www.google.com',gmail:'https://mail.google.com',facebook:'https://www.facebook.com',instagram:'https://www.instagram.com',twitter:'https://x.com',x:'https://x.com',whatsapp:'https://web.whatsapp.com',netflix:'https://www.netflix.com',spotify:'https://open.spotify.com',github:'https://github.com',wikipedia:'https://es.wikipedia.org',maps:'https://maps.google.com',mapas:'https://maps.google.com',linkedin:'https://www.linkedin.com',amazon:'https://www.amazon.com',mercadolibre:'https://www.mercadolibre.com.co',claude:'https://claude.ai',chatgpt:'https://chatgpt.com',figma:'https://www.figma.com',canva:'https://www.canva.com',pinterest:'https://www.pinterest.com',tiktok:'https://www.tiktok.com'};
const nums={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,quince:15,veinte:20,treinta:30,media:.5,medio:.5};
const num=s=>{s=s.trim().toLowerCase();return nums[s]!==undefined?nums[s]:parseFloat(s.replace(',','.'))};
const fmt=n=>Number.isInteger(n)?n.toLocaleString('es-CO'):(+n.toFixed(6)).toLocaleString('es-CO');
const secs=(n,u)=>n*(/^h/.test(u)?3600:/^m/.test(u)?60:1);
function mathOf(q){
 let s=q.toLowerCase().replace(/,/g,'.');
 let m=s.match(/(\d+(?:\.\d+)?)\s*(?:%|por ciento)\s*de\s*(\d+(?:\.\d+)?)/);if(m)return(+m[1]*+m[2]/100);
 m=s.match(/ra[ií]z(?: cuadrada)?\s*de\s*(\d+(?:\.\d+)?)/);if(m)return Math.sqrt(+m[1]);
 m=s.match(/(\d+(?:\.\d+)?)\s*al cuadrado/);if(m)return m[1]*m[1];
 m=s.match(/(\d+(?:\.\d+)?)\s*al cubo/);if(m)return m[1]**3;
 s=s.replace(/más|mas/g,'+').replace(/menos/g,'-').replace(/dividido(?: por| entre)?|entre/g,'/').replace(/multiplicado por|por|veces|[x×]/g,'*').replace(/elevado a la|elevado a/g,'**').replace(/\^/g,'**').replace(/÷/g,'/');
 s=s.replace(/[^0-9+\-*/().\s]/g,' ').replace(/\s+/g,' ').trim();
 if(!/\d\s*[+\-*/]+\s*\(?\d/.test(s))return null;
 try{const v=Function('"use strict";return ('+s+')')();return isFinite(v)?v:null}catch(e){return null}}
function startTimer(sec,label){clearInterval(timerInt);timerEnd=Date.now()+sec*1000;const box=$('tm');box.style.display='block';
 timerInt=setInterval(()=>{const l=Math.max(0,Math.round((timerEnd-Date.now())/1000));box.textContent='⏱ '+String(l/3600|0).padStart(2,'0')+':'+String(l%3600/60|0).padStart(2,'0')+':'+String(l%60).padStart(2,'0');
  if(l<=0){clearInterval(timerInt);box.style.display='none';say('¡Se acabó el tiempo'+(label?' de '+label:'')+'! Ahí está tu temporizador, mi rey.')}},250)}

function local(q){
 const s=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,]/g,'').trim();
 let m;const X=ext(q,s);if(X!==undefined)return X;
